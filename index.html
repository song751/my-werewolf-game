<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover" />
  <title>双身份狼人杀 - 电子法官 (V9.5)</title>
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>
<div class="app">

  <!-- 顶部栏 -->
  <div class="top-bar">
    <h1>🌙 双身份狼人杀</h1>
    <div class="top-right">
      <span id="host-badge" class="badge hidden">👑 主持</span>
      <span id="sheriff-badge-top" class="badge hidden">⭐ 警长</span>
      <button class="control-btn" data-action="open-logs">📜 日志</button>
      <button id="btn-wolf" class="action-btn hidden" data-action="open-wolf">🐺 狼窝</button>
    </div>
  </div>

  <!-- 设置/创建 -->
  <div id="setup-view" style="background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;">
    <h3 style="margin:0 0 8px;font-size:16px;color:var(--text-dim);text-align:center">📋 身份配置</h3>
    <div id="game-creation-info" class="hidden"></div>
    <div id="role-setup"></div>

    <h3 style="margin:12px 0 8px;font-size:16px;color:var(--text-dim);text-align:center">⚙️ 规则选项</h3>
    <div class="role-setup-item">
      <div>女巫自救规则</div>
      <div>
        <select id="opt-witch-selfsave">
          <option value="noFirstNightSelfSave">首夜不能自救</option>
          <option value="onlyFirstNightSelfSave">仅首夜可以自救</option>
        </select>
      </div>
    </div>
    <div class="role-setup-item">
      <div>预言家查验模式</div>
      <div>
        <select id="opt-seer-mode">
          <option value="faction">查阵营（第二张为狼也判狼；隐狼判好人）</option>
          <option value="identity">查身份（只看当前生效身份）</option>
        </select>
      </div>
    </div>
    <div class="role-setup-item">
      <div>狼人胜利条件</div>
      <div>
        <select id="opt-wolf-win">
          <option value="edge">屠边（全金宝宝或全神职出局）</option>
          <option value="exterminate">屠城（所有好人出局）</option>
        </select>
      </div>
    </div>

    <p style="text-align:center;font-size:14px;margin:10px 0;">
      <span style="color:var(--warning)">总身份数: <strong id="total-roles">0</strong></span> |
      <span style="color:var(--success)">预计玩家数: <strong id="player-cnt">0</strong></span>
      <small id="player-count-warning" style="color:var(--warning);display:block;margin-top:6px;"></small>
    </p>
    <div id="setup-error" class="hidden" style="margin:10px 0;padding:10px;border-radius:12px;border:1px solid var(--danger);background:rgba(239,68,68,.1);"></div>
    <div style="text-align:center;margin-top:10px;">
      <button id="btn-create" class="control-btn" data-action="create-game">
        <span id="create-text">创建游戏</span>
        <span id="create-spinner" class="hidden" style="margin-left:8px;">⏳</span>
      </button>
    </div>
  </div>

  <!-- 游戏主界面 -->
  <div id="game-view" class="hidden">
    <div id="game-layout">
      <!-- 左侧玩家列 -->
      <div id="player-grid-left" class="player-grid"></div>

      <!-- 中央面板 -->
      <div class="center-panel">
        <div id="status-bar">等待游戏开始...</div>
        <div id="identity-card"></div>
        <div id="persist" class="hidden"></div>
        <div id="action-panel"></div>
        <div id="host-controls" class="hidden"></div>
      </div>

      <!-- 右侧玩家列 -->
      <div id="player-grid-right" class="player-grid"></div>
    </div>
  </div>

  <!-- 上帝后台 -->
  <div id="god-view" class="hidden" style="background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;">
    <h3 style="margin:0 0 8px;font-size:16px;color:var(--text-dim);text-align:center">👁️ 上帝视角后台</h3>
    <div id="god-player-list"></div>
    <div id="god-log-area" style="margin-top:12px;">
      <h3 style="margin:0 0 8px;font-size:16px;color:var(--text-dim);text-align:center">🤫 上帝专属日志</h3>
      <div id="god-log-content" style="background:var(--panel-light);border:1px solid var(--border);border-radius:12px;padding:10px;max-height:400px;overflow:auto;"></div>
    </div>
  </div>

</div>

<!-- 浮动通知 -->
<div id="notification-container"></div>

<!-- 日志模态 -->
<div id="logs-modal" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <strong>📜 游戏日志</strong>
      <button class="control-btn" data-action="close-modal" data-target="logs-modal">关闭</button>
    </div>
    <div class="modal-body">
      <div id="game-log-content"></div>
    </div>
  </div>
</div>

<!-- 狼窝模态 -->
<div id="wolf-modal" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <strong>🐺 狼窝</strong>
      <button class="control-btn" data-action="close-modal" data-target="wolf-modal">关闭</button>
    </div>
    <div class="modal-body">
      <div id="wolf-votes-display" class="info-box" style="margin-top:0;"></div>
      <div id="wolf-chat-area">
        <div id="wolf-chat-messages" style="background:var(--panel-light);border:1px solid var(--border);border-radius:12px;padding:8px;max-height:200px;overflow:auto;margin-bottom:10px;"></div>
        <div class="inline" style="justify-content:center">
          <input id="wolf-chat-input" placeholder="输入聊天内容…" style="flex:1;padding:8px;border-radius:10px;border:1px solid var(--border);background:rgba(255,255,255,.05);color:var(--text)" />
          <button class="action-btn" data-action="wolf-send">发送</button>
        </div>
      </div>
      <div class="info-box" id="wolf-modal-tips" style="margin-top:8px;"></div>
    </div>
  </div>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<!-- App -->
<script src="assets/js/app.js"></script>
</body>
</html>
