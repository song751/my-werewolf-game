<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>双身份狼人杀 - 电子法官 (V8.0)</title>

<!-- ========= 视觉样式 (CSS) ========= -->
<style>
:root{
    --bg:#1a1a2e;
    --card:#16213e;
    --border:#0f3460;
    --accent:#e94560;
    --text:#eaeaea;
    --success:#00d9ff;
    --danger:#ff006e;
    --warning:#ffb700;
    --gradient:linear-gradient(135deg,#667eea 0%,#764ba2 100%);
    --shadow:0 10px 30px rgba(0,0,0,.3);
    --font-main:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--font-main);line-height:1.6;min-height:100vh}
body{display:flex;justify-content:center;align-items:flex-start;padding:20px;
 background-image:
 radial-gradient(circle at 20% 50%,rgba(233,69,96,.1)0%,transparent 50%),
 radial-gradient(circle at 80% 80%,rgba(0,217,255,.1)0%,transparent 50%)}
#app{width:100%;max-width:900px;background:var(--card);border-radius:20px;padding:30px;box-shadow:var(--shadow);border:1px solid var(--border);animation:fadeIn .5s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform: translateY(0)}}
h1,h2,h3{color:var(--text);margin-bottom:20px;text-align:center;letter-spacing:1px}
h1{background:var(--gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-size:2em;margin-bottom:30px}
h2{color:var(--success);font-size:1.5em;border-bottom:2px solid var(--border);padding-bottom:10px}
h3{color:var(--warning);font-size:1.2em}
hr{border:none;border-top:2px solid var(--border);margin:30px 0}
.hidden{display:none!important}
button{background:var(--accent);color:#fff;border:none;padding:12px 24px;border-radius:12px;cursor:pointer;font-size:16px;font-weight:600;margin:5px;transition:.3s all;position:relative;overflow:hidden}
button::before{content:'';position:absolute;top:50%;left:50%;width:0;height:0;background:rgba(255,255,255,.2);border-radius:50%;transform:translate(-50%,-50%);transition:width .6s,height .6s}
button:hover::before{width:300px;height:300px}
button:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 5px 20px rgba(233,69,96,.4)}
button:disabled{background:#4a4a4a;cursor:not-allowed;opacity:.6}
button.selected{background:var(--success)!important;box-shadow:0 5px 20px rgba(0,217,255,.4)}
button.control-btn{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%)}
button.action-btn{background:linear-gradient(135deg,#f093fb 0%,#f5576c 100%)}
button.confirm-btn{background:linear-gradient(135deg,#4facfe 0%,#00f2fe 100%)}
input[type=number],input[type=text],input[type=password]{width:80px;padding:10px;border-radius:10px;border:2px solid var(--border);background:rgba(255,255,255,.05);color:var(--text);font-size:16px;text-align:center;transition:.3s all}
input:focus{outline:none;border-color:var(--accent);background:rgba(255,255,255,.1)}
.role-setup-item{display:flex;justify-content:space-between;align-items:center;padding:15px;margin:10px 0;background:rgba(255,255,255,.03);border-radius:12px;transition:.3s all;border:1px solid transparent}
.player-list-item{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;margin:12px 0;background:rgba(255,255,255,.05);border-radius:15px;transition:.3s all;border:2px solid transparent}
.player-list-item.dead{opacity:.7;background:rgba(255,0,110,.1)}
.player-list-item.dead-all{opacity:.4;background:rgba(100,100,100,.1);text-decoration:line-through}
.player-list-item.exposed-idiot { border-left: 4px solid var(--warning); padding-left: 16px; }
.life-heart{color:var(--danger);font-size:24px;transition:.3s all;text-shadow:0 0 10px rgba(255,0,110,.5)}
.life-heart.lost{color:#555;text-shadow:none}
.thief-copy{color:#888;font-style:italic;font-size:.9em}
.dead-identity{text-decoration:line-through;opacity:.6}
.action-panel{max-height: 40vh; overflow-y: auto;}
.action-feedback{margin-top:25px;padding:20px;background:rgba(255,255,255,.03);border-radius:15px;text-align:center;border:1px solid var(--border)}
.game-over-banner{padding:40px;text-align:center;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:#fff;border-radius:20px;font-size:28px;font-weight:bold;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.game-over-banner.bad{background:linear-gradient(135deg,#f093fb 0%,#f5576c 100%)}
.role-icon{display:inline-block;width:30px;height:30px;margin-right:10px;text-align:center;line-height:30px;border-radius:50%;background:rgba(255,255,255,.1)}
.loading-spinner{display:inline-block;width:20px;height:20px;border:3px solid rgba(255,255,255,.3);border-radius:50%;border-top-color:var(--accent);animation:spin 1s infinite ease-in-out}
@keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
.identity-card{background:rgba(255,255,255,.05);padding:20px;border-radius:15px;margin:10px 0;border:2px solid var(--border);transition:.3s all}
#host-controls {text-align: center; margin: 20px 0; background: rgba(0,217,255,0.1); padding: 20px; border-radius: 15px; border: 1px solid var(--success);}
#god-player-list { display: flex; flex-direction: column; gap: 12px; }
.god-player-row { display: flex; align-items: center; gap: 15px; background: rgba(0,0,0,0.2); padding: 12px; border-radius: 10px; border-left: 4px solid var(--border); transition: all .3s ease; flex-wrap: wrap; }
.god-player-row.dead-all { opacity: 0.5; background: rgba(100,100,100,0.1); border-left-color: #555; }
.god-player-row .player-id { font-weight: bold; font-size: 1.4em; min-width: 60px; }
.god-player-row .player-health { min-width: 60px; }
.god-player-row .player-identities { display: flex; align-items: center; gap: 10px; font-size: 1.1em; flex-grow: 1; }
.god-player-row .player-status-tags { font-size: 0.9em; color: var(--warning); }
.status-grid {display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin-top: 15px;}
.status-item {background: rgba(255,255,255,0.05); padding: 10px; border-radius: 8px; transition: all .3s ease;}
.status-item.pending {background: rgba(255,183,0,0.2); color: var(--warning);}
.info-box{background:rgba(0,217,255,.1);border:1px solid var(--success);padding:15px;border-radius:10px;margin:15px 0}
.error-box{background:rgba(255,0,110,.1);border:1px solid var(--danger);padding:15px;border-radius:10px;margin:15px 0;color:var(--danger)}
.setup-error{background:rgba(255,0,110,.1);border:2px solid var(--danger);padding:20px;border-radius:15px;margin:20px 0;text-align:center}
#notification-container{position:fixed;top:20px;right:20px;z-index:9999;width:300px}
.notification{background:var(--card);color:var(--text);padding:15px 20px;border-radius:12px;margin-bottom:10px;box-shadow:var(--shadow);border-left:5px solid var(--accent);animation:slideIn .5s ease,fadeOut .5s ease 4.5s forwards}
.notification.success{border-left-color:var(--success)}
.notification.error{border-left-color:var(--danger)}
.notification.info{border-left-color:var(--warning)}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes fadeOut{from{opacity:1}to{opacity:0;transform:translateY(-20px)}}
#game-log-area, #god-log-area {margin-top:20px;max-height: 300px; overflow-y:auto;padding:15px;background:rgba(0,0,0,0.2);border-radius:10px;border:1px solid var(--border)}
#game-log-area h3, #god-log-area h3 {margin-top:0;font-size:1.1em;color:var(--success)}
#game-log-content p, #god-log-content p {margin:0 0 8px;padding-bottom:8px;border-bottom:1px solid rgba(255,255,255,.05)}
#game-log-content p:last-child, #god-log-content p:last-child {border-bottom:none;margin-bottom:0}
#wolf-chat-messages p { margin: 0 0 5px; padding: 0; border: none; }
#wolf-chat-messages p:last-child { margin-bottom: 0; }
#game-creation-info { padding: 20px; background: rgba(0,217,255,0.1); border-radius: 15px; }
#game-creation-info .link-container { display: flex; align-items: center; margin-bottom: 10px; }
#game-creation-info input { flex-grow: 1; text-align: left; padding: 15px; margin-bottom: 0; margin-right: 10px; }

@media(max-width:600px){
    #app{padding:20px}
    h1{font-size:1.5em}
    button{padding:10px 16px;font-size:14px}
    #notification-container{width:auto;left:20px;right:20px}
}
</style>
</head>
<body>
<div id="app">
    <h1 id="game-title">🌙 双身份狼人杀</h1>

    <div id="setup-view">
        <h2>📋 身份配置</h2>
        <div id="game-creation-info" class="hidden"></div>
        <div id="role-setup"></div>
        <p style="text-align:center;font-size:18px;">
            <span style="color:var(--warning)">总身份数: <strong id="total-roles">0</strong></span> |
            <span style="color:var(--success)">预计玩家数: <strong id="player-cnt">0</strong></span>
            <small id="player-count-warning" style="color:var(--warning);display:block;"></small>
        </p>
        <div id="setup-error" class="setup-error hidden"></div>
        <div style="text-align:center;margin-top:20px;">
            <button id="btn-create" class="control-btn" data-action="create-game">
                <span id="create-text">创建游戏</span>
                <span id="create-spinner" class="loading-spinner hidden"></span>
            </button>
        </div>
    </div>

    <div id="game-view" class="hidden">
        <div id="player-info">
            <h2 id="pid-show"></h2>
            <h3>你的身份是:</h3>
            <div id="my-ids" class="identity-card"></div>
            <div id="swap-area" class="hidden">
                <p style="text-align:center;color:var(--warning)">游戏开始前，你可以交换两个身份的顺序。当前生效的身份是第一个。</p>
                <div style="text-align:center;">
                    <button data-action="swap-identities" class="action-btn">🔄 交换顺序</button>
                    <button data-action="confirm-identities" class="confirm-btn">✅ 确定身份顺序</button>
                </div>
            </div>
        </div>
        <hr>
        <div id="game-area">
            <div id="player-status" style="text-align:center;font-size:20px;font-weight:bold;padding:15px;background:rgba(255,255,255,.05);border-radius:15px;margin-bottom:20px;">等待游戏开始...</div>
            <div id="host-controls" class="hidden"></div>
            <div id="persist" class="hidden"></div>
            <div id="action-panel"></div>
            <div id="wolf-chat-area" class="hidden"></div>
            <h3>👥 玩家列表</h3>
            <div id="player-list"></div>
            <div id="game-log-area" class="hidden">
                <h3>📜 游戏日志</h3>
                <div id="game-log-content"></div>
            </div>
        </div>
    </div>

    <div id="god-view" class="hidden">
        <h2>👑 上帝视角后台</h2>
        <div id="god-player-list"></div>
        <div id="god-log-area" class="hidden">
            <h3>🤫 上帝专属日志 (含夜晚信息)</h3>
            <div id="god-log-content"></div>
        </div>
    </div>
</div>
<div id="notification-container"></div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>
/* ==========================================================
   双身份狼人杀 - V8.0
   变更要点：
   - 盗贼复制为完全复制：双狼/双预言家/双女巫等均可用技能（禁：双隐狼、隐狼+狼）。
   - 上帝视角包含夜晚秘密日志；玩家日志去重，保留浮动通知。
   - 预言家查阵营：只要两张牌里有“狼人”则验出“狼人”；隐狼被验为“好人”。
   - 白天投票需主持人手动开启；开启后骑士禁用。
   - 警长若最终独警（退水后只剩1人）直接当选。
   - 狼队拍板与投票权限收紧；猎人队列与回流阶段稳定。
   - classList 调用修复。
   ========================================================== */

// Firebase
const firebaseConfig={apiKey:"AIzaSyCEAgB6DoY8YA6lZnYblhIDVTYH_q8UimI",authDomain:"werewolf-game-master-1f37f.firebaseapp.com",databaseURL:"https://werewolf-game-master-1f37f-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"werewolf-game-master-1f37f",storageBucket:"werewolf-game-master-1f37f.appspot.com",messagingSenderId:"626014452910",appId:"1:626014452910:web:35b6eba412f95f1878013f"};
firebase.initializeApp(firebaseConfig);
const db=firebase.database();

// 角色
const ROLES={
 '平民':{name:'平民',faction:'good',isGod:false,icon:'👤'},
 '守卫':{name:'守卫',faction:'good',isGod:true,icon:'🛡️'},
 '白痴':{name:'白痴',faction:'good',isGod:true,icon:'🤪'},
 '预言家':{name:'预言家',faction:'good',isGod:true,icon:'🔮'},
 '骑士':{name:'骑士',faction:'good',isGod:true,icon:'⚔️'},
 '隐狼':{name:'隐狼',faction:'bad',isGod:false,isInvisible:true,icon:'🌑'},
 '女巫':{name:'女巫',faction:'good',isGod:true,icon:'🧪'},
 '猎人':{name:'猎人',faction:'good',isGod:true,icon:'🔫'},
 '狼人':{name:'狼人',faction:'bad',isGod:false,icon:'🐺'},
 '盗贼':{name:'盗贼',faction:'neutral',isGod:false,isThief:true,icon:'🎭'}
};
const DEFAULT_SETUP={'平民':6,'守卫':1,'白痴':1,'预言家':1,'骑士':1,'女巫':1,'猎人':1,'狼人':2,'隐狼':1,'盗贼':1};

// 禁配（原始对与最终对都要检查）
const FORBIDDEN_RAW=[
  ['预言家','狼人'],
  ['预言家','隐狼'],
  ['盗贼','隐狼'],     // 防止复制出双隐狼（最终对也会再次检查）
  ['隐狼','狼人'],     // 禁 狼人+隐狼
  ['隐狼','隐狼']      // 禁 双隐狼
];

const App={
    gameId:null,playerId:null,isHost:false,gameState:null,allPlayers:{},playerData:null,fullGameData:null,
    gameListener:null,logListener:null,wolfChatListener:null,wolfVotesListener:null,wolfVotesCallbackRef:null,
    logQueryRef:null,seenLogKeys:new Set(),

    $(id){return document.getElementById(id)},
    escapeHTML(str){ if(typeof str!=='string') return ''; return str.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); },
    showNotification(message,type='info',duration=5000){ const c=this.$('notification-container'); const d=document.createElement('div'); d.className=`notification ${type}`; d.textContent=this.escapeHTML(message); c.appendChild(d); setTimeout(()=>d.remove(),duration); },

    // 日志写入：允许任何端写（公开/秘密）
    async addGameLog(message,isSecret=false){
        const logEntry={message,round:this.gameState?.round||0,timestamp:firebase.database.ServerValue.TIMESTAMP,isSecret:isSecret};
        await db.ref(`games/${this.gameId}/logs`).push(logEntry);
    },

    _shuffle(a){let i=a.length,r;while(i){r=Math.floor(Math.random()*i--);[a[i],a[r]]=[a[r],a[i]]}return a;},
    showView(v){['setup-view','game-view','god-view'].forEach(id=>{const el=this.$(id); if(el) el.classList.add('hidden');}); const t=this.$(v+'-view'); if(t) t.classList.remove('hidden');},
    copyLink(inputId){ const input=this.$(inputId); if(!input) return; input.select(); input.setSelectionRange(0,99999); navigator.clipboard.writeText(input.value).then(()=>this.showNotification('链接已复制到剪贴板!','success'),err=>{this.showNotification('复制失败，请手动复制。','error');console.error(err);}); },

    async init(){
        const q=new URLSearchParams(location.search);
        this.gameId=q.get('game'); this.playerId=q.get('player');

        if(this.gameId && this.playerId==='PLAYER_ID'){
            const appEl=this.$('app');
            appEl.innerHTML=`
                <h1>输入你的座位号</h1>
                <div class="info-box" style="text-align:center;">
                    <p>请输入法官分配给你的座位号（数字），然后点击加入游戏。</p>
                    <input type="number" id="player-id-input" placeholder="座位号" style="width:120px; margin-bottom: 20px; padding: 15px; font-size: 1.2em;">
                    <br>
                    <button id="join-game-btn" class="confirm-btn">加入游戏</button>
                </div>`;
            this.$('join-game-btn').addEventListener('click',()=>{
                const enteredId=this.$('player-id-input').value;
                if(enteredId && !isNaN(enteredId) && enteredId>0){
                    const u=new URL(location.href); u.searchParams.set('player',enteredId); location.href=u.toString();
                }else{ this.showNotification('请输入一个有效的座位号。','error'); }
            });
            return;
        }

        document.body.addEventListener('click',this.handleGlobalClick.bind(this));
        if(this.gameId){ this.startApp(); } else { this.showView('setup'); this.renderRoleSetup(); }
    },

    async startApp(){
        const gameRef=db.ref(`games/${this.gameId}`);
        const snapshot=await gameRef.once('value');
        if(!snapshot.exists()){ document.body.innerHTML='<h1>游戏不存在或已损坏。请确认链接是否正确，或刷新重试。</h1>'; return; }
        if(this.playerId==='0'){ this.showView('god'); this.listenToGameChanges(this.renderGodView.bind(this)); }
        else if(this.playerId){ this.showView('game'); this.listenToGameChanges(this.renderAll.bind(this)); this.listenToLogs(); }
    },

    handleGlobalClick(e){
        const target=e.target.closest('button[data-action]'); if(!target || target.disabled) return;
        const {action,id,value,gameid,inputid}=target.dataset;
        if(action==='copy-link'){ this.copyLink(inputid); return; }
        if(id!==undefined && !/^\d+$/.test(id)){ this.showNotification('检测到无效操作ID，已阻止。','error'); console.error(`Invalid ID "${id}" for action "${action}"`); return; }

        if(action==='join-as-creator'){ this.gameId=gameid; this.playerId='1'; history.pushState(null,'',`?game=${this.gameId}&player=${this.playerId}`); this.startApp(); return; }

        // Host actions
        if(action.startsWith('host-')){
            if(!this.isHost) return;
            switch(action){
                case 'host-force-start':
                    if(confirm('确定要强制开始游戏吗？未准备的玩家将以默认身份顺序开始。')){
                        const updates={}; Object.values(this.allPlayers).forEach(p=>{ if(!p.isReady) updates[`players/${p.id}/isReady`]=true; });
                        db.ref(`games/${this.gameId}`).update(updates).then(()=>this.updatePhase('NIGHT',1));
                    }
                    break;
                case 'host-start': this.updatePhase('NIGHT',1); break;
                case 'host-force-day': if(confirm('确定要强制进入白天吗？所有未行动的玩家将视为无操作。')) this.processNight(); break;
                case 'host-day': this.processNight(); break;
                case 'host-sheriff-cand-init': this.updatePhase('SHERIFF_CAND'); break;
                case 'host-sheriff-speech': this.updatePhase('SHERIFF_SPEECH'); break;
                case 'host-sheriff-vote': this.hostEnterSheriffVote(); break;
                case 'host-tally-sheriff': this.tallySheriffVotes(); break;
                case 'host-force-tally-sheriff': if(confirm('确定要强制统计警长票吗？未投票的玩家将视为弃票。')) this.tallySheriffVotes(); break;
                case 'host-sheriff-elect-single': this.hostSheriffElectSingle(); break;
                case 'host-open-day-vote': db.ref(`games/${this.gameId}/state/dayVotingOpen`).set(true); break;
                case 'host-close-day-vote': db.ref(`games/${this.gameId}/state/dayVotingOpen`).set(false); break;
                case 'host-tally-day': this.tallyDayVotes(); break;
                case 'host-force-badge-destroy': if(confirm('确定要强制撕毁警徽吗？')) this.playerDestroyBadge(true); break;
                case 'host-reveal': this.renderPlayerList(true); break;
            }
            return;
        }

        const provideImmediateFeedback=(btn)=>{ const panel=btn.closest('.action-panel'); if(panel){ panel.querySelectorAll('button[data-action]').forEach(b=>b.disabled=true); btn.classList.add('selected'); } };

        // Player actions
        switch(action){
            case 'create-game': this.createGame(); break;
            case 'swap-identities': db.ref(`games/${this.gameId}/players/${this.playerId}/identities`).transaction(ids=>ids?[ids[1],ids[0]]:null); break;
            case 'confirm-identities': db.ref(`games/${this.gameId}/players/${this.playerId}/isReady`).transaction(isReady=>isReady||true); break;
            case 'sheriff-cand': db.ref(`games/${this.gameId}/sheriff/candidates/${this.playerId}`).set(Number(value)); break;
            case 'sheriff-drop': db.ref(`games/${this.gameId}/sheriff/drops/${this.playerId}`).set(true); break;
            case 'sheriff-vote': db.ref(`games/${this.gameId}/sheriff/votes/${this.playerId}`).set(id); break;
            case 'sheriff-pass-badge': this.playerPassBadge(id); break;
            case 'sheriff-destroy-badge': this.playerDestroyBadge(); break;
            case 'day-vote':
                if(!this.fullGameData?.state?.dayVotingOpen){ this.showNotification('主持人尚未开启投票。','error'); return; }
                db.ref(`games/${this.gameId}/dayVotes/${this.gameState.round}/${this.playerId}`).set(id); break;
            case 'knight-duel': 
                if(this.fullGameData?.state?.dayVotingOpen){ this.showNotification('投票已开启，骑士此时不可发动。','error'); return; }
                this.knight(id); break;
            case 'guard-protect': provideImmediateFeedback(target); this.guardProtect(id); break;
            case 'guard-skip': provideImmediateFeedback(target); this.guardSkip(); break;
            case 'seer-check': provideImmediateFeedback(target); this.seerCheck(id); break;
            case 'seer-skip': provideImmediateFeedback(target); this.seerSkip(); break;
            case 'wolf-vote': 
                if(!this.canWolfAct(this.playerData) || this.gameState?.nightStatus?.wolf!=='pending'){ this.showNotification('你现在不能进行狼人投票。','error'); return; }
                db.ref(`games/${this.gameId}/wolfVotes/${this.playerId}`).set(id); break;
            case 'wolf-skip':
                if(!this.canWolfAct(this.playerData) || this.gameState?.nightStatus?.wolf!=='pending'){ this.showNotification('你现在不能进行狼人投票。','error'); return; }
                db.ref(`games/${this.gameId}/wolfVotes/${this.playerId}`).set('0'); break;
            case 'wolf-confirm': provideImmediateFeedback(target); this.wolfConfirmKill(id); break;
            case 'wolf-send': this.sendWolfMessage(); break;
            case 'witch-cure': provideImmediateFeedback(target); this.witchUseCure(id); break;
            case 'witch-poison': provideImmediateFeedback(target); this.witchUsePoison(id); break;
            case 'witch-skip': provideImmediateFeedback(target); this.witchSkip(); break;
            case 'hunter-shoot': this.hunter(id); break;
        }
    },

            await this.updatePhase('SHERIFF_VOTE');

    listenToLogs(){

        this.seenLogKeys.clear();

        this.logListener = this.logQueryRef.on('child_added', snap=>{
            if(!snap.exists()) return;
            const key=snap.key; if(this.seenLogKeys.has(key)) return;
            this.seenLogKeys.add(key);
            const log=snap.val();
            if(log && !log.isSecret){
                const logArea=this.$('game-log-area'); const logContent=this.$('game-log-content');
                if(logArea.classList.contains('hidden')) logArea.classList.remove('hidden');
                const p=document.createElement('p');

    async createGame(){
        this.$('btn-create').disabled=true;
        this.$('create-text').classList.add('hidden');
        this.$('create-spinner').classList.remove('hidden');
        const errorEl=this.$('setup-error'); if(errorEl) errorEl.classList.add('hidden');

        const pool=[]; let configStr='当前配置：';
        this.$('role-setup').querySelectorAll('input').forEach(i=>{
            const r=i.id.replace('role-',''); const count=+i.value;
            if(count>0) configStr+=`${r}x${count} `;
            for(let k=0;k<count;k++) pool.push(r);
        });

        if(pool.length===0 || pool.length%2!==0){ this.showSetupError('身份总数需为偶数且大于0'); return; }
        if(pool.length/2>12){ this.showSetupError('玩家过多，建议不超过12人。'); return; }

        const pairs=this.deal(pool);
        if(!pairs){
            this.showSetupError(`无法生成符合规则的牌组，请调整身份配置后重试。<br><small>提示：确保“金水宝宝”总数（包括盗贼生成的）在1-2个之间，且组合不违反禁配规则。</small><br><small>${configStr}</small>`);
            return;
        }

        const gId=db.ref('games').push().key, pc=pool.length/2, players={};
        for(let i=1;i<=pc;i++){
            players[i]={ id:i, identities:pairs[i-1], originalIdentities:JSON.parse(JSON.stringify(pairs[i-1])), deaths:0, isAlive:true, isReady:false, isExposedIdiot:false, skillStates:{}, badge:0 };
        }

        await db.ref(`games/${gId}`).set({
            state:{phase:'SETUP',round:0,peaceNightStreak:0,winner:null,creatorId:1, nightStatus:{}, hunterQueue:{}, postDeathState:null, dayVotingOpen:false},
            players, config:{pc}, wolfChat:{}, wolfVotes:{}, nightActions:{}, sheriff:{}, dayVotes:{}, logs:{}
        });

        this.showNotification('游戏创建成功！','success');
        this.$('role-setup').classList.add('hidden');
        this.$('btn-create').classList.add('hidden');
        const infoEl=this.$('game-creation-info'); infoEl.classList.remove('hidden');
        const baseUrl=`${location.origin}${location.pathname}`; const playerUrl=`${baseUrl}?game=${gId}&player=PLAYER_ID`;
        infoEl.innerHTML = `<h3>✅ 游戏创建成功</h3>
            <p>请将以下链接模板分发给玩家，让他们将 "PLAYER_ID" 替换为自己的座位号:</p>
            <div class="link-container">
                <input type="text" readonly id="player-link-template" value="${playerUrl}">

            </div>

    },

        if(errorEl){ errorEl.innerHTML=`<h3>❌ 创建失败</h3><p>${msg.replace(/\n/g,'<br>')}</p>`; errorEl.classList.remove('hidden'); }

    // 发牌，包含盗贼复制；最终检查双隐狼/隐狼+狼禁用
    deal(pool){
        for(let t=0;t<5000;t++){
            const s=this._shuffle([...pool]);
            let isValid=true;
            const rawPairs=[];
            for(let i=0;i<s.length;i+=2){ const p=[s[i],s[i+1]].sort(); rawPairs.push(p); }
            for(const p of rawPairs){
                if(FORBIDDEN_RAW.some(([r1,r2])=> (r1===p[0]&&r2===p[1]) || (r1===p[1]&&r2===p[0]))){ isValid=false; break; }
            }
            if(!isValid) continue;

            const finalPairs=[]; const finalRoles={};
            for(const p of rawPairs){
                let p1,p2;
                if(p[0]==='盗贼'){ // 盗贼复制另一张身份（完全复制，可行动）
                    p1={r:p[1],t:true};
                    p2={r:p[1],t:false};
                }else{
                    p1={r:p[0],t:false};
                    p2={r:p[1],t:false};
                }
                finalPairs.push([{role:p1.r,isThiefCopy:p1.t},{role:p2.r,isThiefCopy:p2.t}]);
                finalRoles[p1.r]=(finalRoles[p1.r]||0)+1;
                finalRoles[p2.r]=(finalRoles[p2.r]||0)+1;
            }

            const goldenBabyCount = finalPairs.filter(p=>p[0].role==='平民' && p[1].role==='平民').length;
            if(goldenBabyCount<1 || goldenBabyCount>2) continue;

            // 最终组合禁配（防双隐狼、隐狼+狼）
            for(const pair of finalPairs){
                const roles=[pair[0].role,pair[1].role].sort();
                if(FORBIDDEN_RAW.some(([r1,r2])=> (r1===roles[0]&&r2===roles[1]) || (r1===roles[1]&&r2===roles[0]))){ isValid=false; break; }
            }
            if(!isValid) continue;

            const wolfCount=(finalRoles['狼人']||0)+(finalRoles['隐狼']||0);
            if(wolfCount===0) continue;

            const godCount=Object.keys(finalRoles).reduce((sum,role)=> sum+(ROLES[role].isGod?finalRoles[role]:0),0);
            if(godCount===0) continue;

            return finalPairs;
        }
        return null;
    },

    renderHostControls(){
        const el=this.$('host-controls'); if(!el) return;
        el.classList.remove('hidden');
        const ph=this.gameState.phase; let h=`<h3>👑 主持人面板</h3>`;

        const renderStatusGrid=(title, totalList, doneList)=>{
            const doneIds=doneList.map(p=>p.id.toString());
            const pendingList=totalList.filter(p=>!doneIds.includes(p.id.toString()));
            let gridHtml=`<div class="info-box">${title}：${doneIds.length} / ${totalList.length}</div>`;
            if(pendingList.length>0){ gridHtml+='<div class="status-grid">'; pendingList.forEach(p=>gridHtml+=`<div class="status-item pending">${p.id}号 未完成</div>`); gridHtml+='</div>'; }
            return gridHtml;
        };

        switch(ph){
            case 'SETUP': {
                const rdy=Object.values(this.allPlayers).filter(p=>p.isReady), tot=Object.values(this.allPlayers);
                h+=renderStatusGrid('玩家准备',tot,rdy);
                if(rdy.length<tot.length) h+=`<button data-action="host-force-start" class="action-btn">强制开始</button>`;
                h+=`<button data-action="host-start" class="control-btn" ${rdy.length<tot.length?'disabled':''}>🚀 开始游戏</button>`;
                break;
            }
            case 'NIGHT': {
                const ns=this.gameState.nightStatus||{}, done=Object.values(ns).every(s=>s==='complete');
                h+=`<p style="font-size: 1.2em; margin-bottom: 15px;">${done?'✅ 所有行动已完成':'⏳ 等待玩家行动...'}</p>`;
                const pendingCount=Object.values(ns).filter(s=>s==='pending'||s==='locked').length; const totalTasks=Object.values(ns).length;
                if(totalTasks>0) h+=`<div class="info-box">行动进度：${totalTasks-pendingCount} / ${totalTasks}</div>`;
                const hasSheriff=Object.values(this.allPlayers).some(p=>p.badge);
                if(this.gameState.round===1 && !hasSheriff){
                    h+=`<button data-action="host-sheriff-cand-init" class="control-btn" ${!done?'disabled':''}>👑 开始上警</button>`;
                    if(!done) h+=`<button data-action="host-force-day" class="action-btn">强制进入白天</button>`;
                }else{
                    if(!done) h+=`<button data-action="host-force-day" class="action-btn">强制天亮</button>`;
                    h+=`<button data-action="host-day" class="control-btn" ${!done?'disabled':''}>☀️ 天亮了 (结算夜晚)</button>`;
                }
                break;
            }
            case 'SHERIFF_CAND': {
                const alive=Object.values(this.allPlayers).filter(p=>p.isAlive);
                const decided=Object.values(this.allPlayers).filter(p=>this.fullGameData.sheriff?.candidates?.[p.id]!=null);
                h+=renderStatusGrid('上警意向',alive,decided);
                h+=`<button data-action="host-sheriff-speech" class="control-btn" ${decided.length<alive.length?'disabled':''}>进入发言阶段</button>`;
                break;
            }
            case 'SHERIFF_SPEECH': {
                // 若独警，提供直接当选按钮
                const cand=this.fullGameData.sheriff?.candidates||{}; const drops=this.fullGameData.sheriff?.drops||{};
                const valid=Object.keys(cand).filter(id=>cand[id] && !drops[id]);
                if(valid.length===1) h+=`<div class="info-box">当前独警：${valid[0]}号</div><button data-action="host-sheriff-elect-single" class="confirm-btn">直接当选</button>`;
                h+=`<button data-action="host-sheriff-vote" class="control-btn">进入投票阶段</button>`;
                break;
            }
            case 'SHERIFF_VOTE': {
                const voters=Object.values(this.allPlayers).filter(p=>p.isAlive && !p.isExposedIdiot);
                const votedData=this.fullGameData.sheriff?.votes||{};
                const votedPlayers=Object.keys(votedData).map(id=>this.allPlayers[id]).filter(Boolean);
                h+=renderStatusGrid('警长投票',voters,votedPlayers);
                h+=`<button data-action="host-tally-sheriff" class="control-btn" ${votedPlayers.length<voters.length?'disabled':''}>📊 统计警长票</button>`;
                h+=`<button data-action="host-force-tally-sheriff" class="action-btn">强制计票</button>`;
                break;
            }
            case 'DAY': {
                const dayOpen=!!this.fullGameData?.state?.dayVotingOpen;
                h+=`<div class="info-box">投票开关：${dayOpen?'已开启 ✅':'未开启 ⏳'}</div>`;
                if(!dayOpen){
                    h+=`<button data-action="host-open-day-vote" class="control-btn">🔓 开启白天投票</button>`;
                }else{
                    h+=`<button data-action="host-close-day-vote" class="action-btn">🔒 关闭白天投票</button>`;
                }
                if(dayOpen){
                    const voters=Object.values(this.allPlayers).filter(p=>p.isAlive && !p.isExposedIdiot);
                    const dayVotedData=this.fullGameData.dayVotes?.[this.gameState.round]||{};
                    const dayVotedPlayers=Object.keys(dayVotedData).map(id=>this.allPlayers[id]).filter(Boolean);
                    h+=renderStatusGrid('放逐投票',voters,dayVotedPlayers);
                    h+=`<button data-action="host-tally-day" class="control-btn" ${dayVotedPlayers.length<voters.length?'disabled':''}>📊 统计放逐票</button>`;
                }else{
                    h+=`<div class="info-box">提示：投票未开启前，骑士仍可发动决斗。</div>`;
                }
                break;
            }
            case 'SHERIFF_TRANSFER': {
                h+=`<h4>警长已阵亡</h4><p>等待玩家操作或强制撕毁警徽</p>`;
                h+=`<button data-action="host-force-badge-destroy" class="action-btn">强制撕毁</button>`;
                break;
            }
            case 'GAME_OVER': {
                h+=`<button data-action="host-reveal" class="control-btn">👁️ 复盘：显示所有身份</button>`;
                break;
            }
        }
        el.innerHTML=h;
    },

    renderActionPanel(){
        const panelEl=this.$('action-panel'); if(!panelEl) return;
        panelEl.innerHTML=''; panelEl.classList.remove('hidden');

        const isDead=!this.playerData.isAlive;
        const isSheriffTransferTarget=this.gameState.phase==='SHERIFF_TRANSFER' && this.gameState.postDeathState && this.playerId===this.gameState.postDeathState.deadSheriffId;
        if(this.gameState.phase==='GAME_OVER' || (isDead && !isSheriffTransferTarget)){ panelEl.classList.add('hidden'); return; }

        const phase=this.gameState.phase;
        const activeRole=this.getActiveRole(this.playerData);
        let content=''; const renderFeedback=(msg)=>`<div class="action-feedback"><p>${this.escapeHTML(msg)}</p></div>`;

        switch(phase){
            case 'SHERIFF_CAND': {
                if(isDead) break;
                const cand=this.fullGameData.sheriff?.candidates?.[this.playerId];
                if(cand!=null) content=renderFeedback(`你已选择 ${cand?'上警':'不上警'}`); else { this.panelSheriffCand(); return; }
                break;
            }
            case 'SHERIFF_SPEECH': {
                if(isDead) break;
                const isCandidate=this.fullGameData.sheriff?.candidates?.[this.playerId];
                const hasDropped=this.fullGameData.sheriff?.drops?.[this.playerId];
                if(isCandidate && !hasDropped){ this.panelSheriffDrop(); return; }
                content=renderFeedback('等待主持人推进流程...');
                break;
            }
            case 'SHERIFF_VOTE': {
                if(this.playerData.isExposedIdiot || isDead){ content=renderFeedback('你无法投票。'); break; }
                const sheriffVote=this.fullGameData.sheriff?.votes?.[this.playerId];
                if(sheriffVote!=null){ content=renderFeedback(`你已投票给 ${sheriffVote==='0'?'弃票':sheriffVote+'号'}`); }
                else { this.panelSheriffVote(); return; }
                break;
            }
            case 'DAY': {
                const dayOpen=!!this.fullGameData?.state?.dayVotingOpen;
                if(!dayOpen){
                    // 投票未开启：骑士可发动；其他人显示等待
                    if(activeRole==='骑士' && !this.getSkillState('hasUsedDuel')){
                        this.panelDayPreVoteKnight(); return;
                    }else{
                        content=renderFeedback('等待主持人开启投票…');
                    }
                }else{
                    // 投票已开启：正常投票，骑士禁用
                    if(this.playerData.isExposedIdiot || isDead){ content=renderFeedback('你无法投票。'); break; }
                    const dayVote=this.fullGameData.dayVotes?.[this.gameState.round]?.[this.playerId];
                    if(dayVote!=null){ content=renderFeedback(`你已投票给 ${dayVote==='0'?'弃票':dayVote+'号'}`); }
                    else { this.panelDayVote(); return; }
                }
                break;
            }
            case 'NIGHT': {
                if(isDead) break;
                const nightStatus=this.gameState.nightStatus||{};
                if(['狼人','隐狼'].includes(activeRole) && nightStatus.wolf==='pending'){ this.panelWolf(); return; }
                switch(activeRole){
                    case '守卫': if(nightStatus.guard==='pending'){ this.panelGuard(); return; } break;
                    case '预言家': if(nightStatus.seer==='pending'){ this.panelSeer(); return; } break;
                    case '女巫': if(nightStatus.witch==='pending'){ this.panelWitch(); return; } break;
                }
                content=renderFeedback('请耐心等待天亮...');
                break;
            }
            case 'HUNTER_ACTION': {
                if(this.gameState.hunterQueue && this.gameState.hunterQueue[this.playerId]){ this.panelHunter(); return; }
                content=renderFeedback('等待猎人开枪...');
                break;
            }
            case 'SHERIFF_TRANSFER': {
                if(isSheriffTransferTarget){ this.panelSheriffTransfer(); return; }
                content=renderFeedback('等待警长移交警徽...');
                break;
            }
            default: panelEl.classList.add('hidden');
        }
        panelEl.innerHTML=content;
    },

    // Panels

        const allLivingWolves=Object.values(this.allPlayers).filter(p=>p.isAlive && ['狼人','隐狼'].includes(this.getActiveRole(p)));

        let teammatesToDisplay;
        if(myRole==='隐狼'){ teammatesToDisplay=allLivingWolves.filter(p=>p.id!=this.playerId); }
        else { teammatesToDisplay=livingRegularWolves.filter(p=>p.id!=this.playerId); }

        const canAct=this.canWolfAct(this.playerData);
        const myVote=this.fullGameData.wolfVotes?.[this.playerId];
        let h=`<h3>🐺 狼人行动</h3>`;
        if(myRole==='隐狼' && livingRegularWolves.length>0){ h+=`<p style="color:var(--warning)">你是隐狼，当有其他普通狼人存活时，你不能行动。</p>`; }
        h+=`<div class="info-box">🐺 队友：${teammatesToDisplay.length>0?teammatesToDisplay.map(p=>`${p.id}号(${this.getActiveRole(p)})`).join('、'):'无'}</div>`;

        h+=`<button class="control-btn ${myVote==='0'?'selected':''}" data-action="wolf-skip" ${!canAct?'disabled':''}>🚫 今夜空刀</button>`;
        this.$('action-panel').innerHTML=h;

        const chatEl=this.$('wolf-chat-area');
        if(myRole==='狼人'){
            if(chatEl){
                chatEl.classList.remove('hidden');
                chatEl.innerHTML = `
                    <div id="wolf-votes-display"></div>
                    <h4>💬 狼人内部讨论</h4>
                    <div id="wolf-chat-messages" style="max-height:150px;overflow-y:auto;background:rgba(255,255,255,.05);padding:10px;border-radius:8px;margin-bottom:10px;text-align:left;"></div>
                    <div style="display:flex;gap:6px;">
                        <input id="wolf-chat-input" placeholder="输入聊天内容…" style="flex:1;padding:8px;border-radius:8px;border:1px solid var(--border);background:rgba(0,0,0,.2);color:var(--text); width: auto;" />
                        <button class="action-btn" data-action="wolf-send" style="padding: 8px 16px;">发送</button>
                    </div>`;
                this.$('wolf-chat-input').addEventListener('keyup',(e)=>{ if(e.key==='Enter') this.sendWolfMessage(); });
            }
        }else{
            if(chatEl){ chatEl.classList.remove('hidden'); chatEl.innerHTML=`<div id="wolf-votes-display"></div>`; }
        }
        this.initWolfListeners();
    },
    panelSheriffCand(){ this.$('action-panel').innerHTML=`<h3>👑 是否上警？</h3><button data-action="sheriff-cand" data-value="1" class="action-btn">我要上警</button><button data-action="sheriff-cand" data-value="0" class="control-btn">不上警</button>`; },

    // 阶段切换
    async updatePhase(phase,round=null){
        const up={'state/phase':phase};
        if(round!==null){ up['state/round']=round; }
        else if(phase==='NIGHT'){ up['state/round']=this.gameState.round+1; }

        if(phase==='NIGHT'){
            up['nightActions']={}; up['wolfVotes']={}; up['wolfChat']={};
            const alivePlayers=Object.values(this.allPlayers).filter(p=>p.isAlive);
            const roleExists=(role)=>alivePlayers.some(p=>this.getActiveRole(p)===role);
            const witchPlayer=alivePlayers.find(p=>this.getActiveRole(p)==='女巫');
            const witchIdx=witchPlayer?witchPlayer.deaths:-1;
            const canWitchUseSkill=witchPlayer && (!this.getSkillState('hasUsedCure',witchPlayer,witchIdx) || !this.getSkillState('hasUsedPoison',witchPlayer,witchIdx));
            const nightStatus={ guard:roleExists('守卫')?'pending':'complete', seer:roleExists('预言家')?'pending':'complete', wolf:this.isAnyWolfInGame()?'pending':'complete', witch:canWitchUseSkill?'locked':'complete' };
            if(nightStatus.wolf==='complete' && nightStatus.witch==='locked') nightStatus.witch='pending';
            up['state/nightStatus']=nightStatus;
        }
        if(phase==='DAY'){ up['state/dayVotingOpen']=false; } // 白天默认未开票
        await db.ref(`games/${this.gameId}`).update(up);
    },

    // 夜行/技能
    sendWolfMessage(){
        const myRole=this.getActiveRole(this.playerData);
        if(myRole==='隐狼'){ this.showNotification('隐狼不能参与狼人讨论。','error'); return; }
        const input=this.$('wolf-chat-input'); if(!input) return;
        const msg=(input.value||'').trim(); if(!msg) return;
        if(msg.length>120){ this.showNotification('消息过长 (≤120 字)。','error'); return; }
        db.ref(`games/${this.gameId}/wolfChat`).push({pid:this.playerId,msg,ts:firebase.database.ServerValue.TIMESTAMP});
        input.value='';
    },

    async wolfConfirmKill(targetId){
        // 权限校验：必须是当前拍板狼，且可行动，且狼行动为 pending
        const alpha=this.getAlphaWolfId();
        if(this.playerId!==alpha || !this.canWolfAct(this.playerData) || this.gameState?.nightStatus?.wolf!=='pending'){
            this.showNotification('你无权确认或当前不可确认。','error'); return;
        }
        const actionRef=db.ref(`games/${this.gameId}/nightActions/${this.gameState.round}/wolf`);
        actionRef.transaction(cur=>{ if(cur) return; return {target:targetId,actorId:this.playerId}; })
        .then(async (res)=>{
            if(res.committed){
                await this.addGameLog(`🐺 狼队决定袭击 ${targetId==='0'?'空刀':targetId+'号'} (由${this.playerId}号确认)`,true);
                await db.ref(`games/${this.gameId}/state/nightStatus`).transaction(st=>{ if(!st) return st; st.wolf='complete'; if(st.witch==='locked') st.witch='pending'; return st; });
                this.showNotification(`狼队已决定袭击 ${targetId==='0'?'空刀':targetId+'号'}`,'info');
            }
        });
    },

    // 预言家查阵营（隐狼躲验；若任一张是“狼人”，则判为狼人）
    async seerCheck(targetId){
        const target=this.allPlayers[targetId];
        const hasRegularWolf = (target.identities||[]).some(id=>id.role==='狼人');
        const hasInvisibleWolf = (target.identities||[]).some(id=>id.role==='隐狼');
        const result = hasRegularWolf ? '狼人' : '好人'; // 隐狼不暴露
        await db.ref(`games/${this.gameId}/nightActions/${this.gameState.round}/seer`).set({ target:targetId, result, actorId:this.playerId });
        await this.addGameLog(`🔮 预言家(${this.playerId}号)查验 ${targetId}号, 结果为 ${result}`, true);
        await db.ref(`games/${this.gameId}/state/nightStatus/seer`).set('complete');
        const results=this.getGlobalSkillState('seerResults')||{}; results[targetId]=result;
        await this.setGlobalSkillState('seerResults',results);
        this.showNotification(`查验结果：${targetId}号是${result==='狼人'?'🐺 狼人':'😇 好人'}`,'success');
    },
    async seerSkip(){
        await db.ref(`games/${this.gameId}/nightActions/${this.gameState.round}/seer`).set({ target:null, actorId:this.playerId, skipped:true });
        await this.addGameLog(`🔮 预言家(${this.playerId}号)跳过查验`, true);
        await db.ref(`games/${this.gameId}/state/nightStatus/seer`).set('complete');
    },

    async guardProtect(targetId){
        await db.ref(`games/${this.gameId}/nightActions/${this.gameState.round}/guard`).set({ target:targetId, actorId:this.playerId });
        await this.addGameLog(`🛡️ 守卫(${this.playerId}号)守护了 ${targetId}号`, true);
        await db.ref(`games/${this.gameId}/state/nightStatus/guard`).set('complete');
        await this.setSkillState('lastGuardTarget',targetId);
        this.showNotification(`你守护了 ${targetId}号`,'success');
    },
    async guardSkip(){
        await db.ref(`games/${this.gameId}/nightActions/${this.gameState.round}/guard`).set({ target:null, actorId:this.playerId });
        await this.addGameLog(`🛡️ 守卫(${this.playerId}号)空守`, true);
        await db.ref(`games/${this.gameId}/state/nightStatus/guard`).set('complete');
        await this.setSkillState('lastGuardTarget',null);
    },

    async witchUseCure(targetId){
        const identityIndex=this.playerData.deaths;
        const actionRef=db.ref(`games/${this.gameId}/players/${this.playerId}/skillStates`);
        actionRef.transaction(states=>{ if(!states) states={}; const key=`${identityIndex}_hasUsedCure`; if(states[key]) return; states[key]=true; return states; })
        .then(async (res)=>{
            if(res.committed){
                await db.ref(`games/${this.gameId}/nightActions/${this.gameState.round}/witch`).update({cure:targetId});
                await this.addGameLog(`🧪 女巫(${this.playerId}号)使用解药救了 ${targetId}号`, true);
                await db.ref(`games/${this.gameId}/state/nightStatus/witch`).set('complete');
                this.showNotification(`你使用解药救了 ${targetId}号`,'success');
            }
        });
    },
    async witchUsePoison(targetId){
        const identityIndex=this.playerData.deaths;
        const actionRef=db.ref(`games/${this.gameId}/players/${this.playerId}/skillStates`);
        actionRef.transaction(states=>{ if(!states) states={}; const key=`${identityIndex}_hasUsedPoison`; if(states[key]) return; states[key]=true; return states; })
        .then(async (res)=>{
            if(res.committed){
                await db.ref(`games/${this.gameId}/nightActions/${this.gameState.round}/witch`).update({poison:targetId});
                await this.addGameLog(`🧪 女巫(${this.playerId}号)使用毒药毒杀了 ${targetId}号`, true);
                await db.ref(`games/${this.gameId}/state/nightStatus/witch`).set('complete');
                this.showNotification(`你使用毒药毒杀了 ${targetId}号`,'error');
            }
        });
    },
    async witchSkip(){
        await db.ref(`games/${this.gameId}/nightActions/${this.gameState.round}/witch`).update({ actorId:this.playerId, skipped:true });
        await this.addGameLog(`🧪 女巫(${this.playerId}号)没有使用药水`, true);
        await db.ref(`games/${this.gameId}/state/nightStatus/witch`).set('complete');
    },

    async knight(targetId){
        await this.setSkillState('hasUsedDuel',true);
        const target=this.allPlayers[targetId];
        const targetRole=this.getActiveRole(target);
        const isEvil=['狼人','隐狼'].includes(targetRole);
        const loserId=isEvil?targetId:this.playerId;
        const loserRole=isEvil?targetRole:this.getActiveRole(this.playerData);
        await this.addGameLog(`⚔️ 骑士 ${this.playerId}号 对 ${targetId}号 发动决斗！`);
        const killResult=await this.kill(loserId,'DUEL');
        if(isEvil){
            await this.addGameLog(`决斗成功！${loserId}号 (${loserRole}) 阵亡！游戏直接进入夜晚。`);
            await this.handlePostDeath({ ...killResult, nextPhaseIfNoAction:'NIGHT' });
        }else{
            await this.addGameLog(`决斗失败！骑士 ${loserId}号 阵亡！`);
            await this.handlePostDeath({ ...killResult, nextPhaseIfNoAction:'DAY' });
        }
    },

    async hunter(targetId){
        await this.addGameLog(`🔫 猎人 ${this.playerId}号 开枪带走了 ${targetId}号！`);
        // 当前执行者出队
        await db.ref(`games/${this.gameId}/state/hunterQueue/${this.playerId}`).set(null);
        const killResult=await this.kill(targetId,'HUNTER');
        if(killResult.sheriffDied) return; // 警长死亡优先等待移交
        // 检查是否还有猎人
        const remaining= (await db.ref(`games/${this.gameId}/state/hunterQueue`).once('value')).val() || {};
        if(Object.keys(remaining).length>0){
            await this.updatePhase('HUNTER_ACTION');
        }else{
            const nextPhase = this.gameState.postDeathState?.nextPhase || (this.gameState.phase==='DAY'?'NIGHT':'DAY');
            // 若非警徽移交场景，清理 postDeathState
            if(!this.gameState.postDeathState || !this.gameState.postDeathState.deadSheriffId){
                await db.ref(`games/${this.gameId}/state/postDeathState`).set(null);
            }
            await this.updatePhase(nextPhase);
        }
    },

    // 计票
    async tallySheriffVotes(){
        const votes=this.fullGameData.sheriff?.votes||{};
        const voteCounts={};
        Object.values(votes).forEach(target=>{ if(target!=='0') voteCounts[target]=(voteCounts[target]||0)+1; });
        const voters=Object.values(this.allPlayers).filter(p=>p.isAlive && !p.isExposedIdiot);
        let details='警长投票详情：'+voters.map(voter=>{
            const t=votes[voter.id];
            if(t===undefined) return `${voter.id}号(未投票)`;
            if(t==='0') return `${voter.id}号(弃票)`;
            return `${voter.id}号 → ${t}号`;
        }).join('，');
        await this.addGameLog(details);

        const maxVotes=Object.keys(voteCounts).length>0?Math.max(...Object.values(voteCounts)):0;
        const winners=Object.keys(voteCounts).filter(id=>voteCounts[id]===maxVotes);
        if(winners.length===1){
            const sheriffId=winners[0];
            await db.ref(`games/${this.gameId}/players/${sheriffId}/badge`).set(1);
            await this.addGameLog(`👑 投票结束，${sheriffId}号玩家当选警长！`);
            if(this.gameState.round===1){ await this.processNight(); } else { await this.updatePhase('DAY'); }
        }else{
            const message=winners.length>1?`平票：${winners.join('、')}号。重新发言并投票。`:'无人当选警长，此后无警长。';
            await this.addGameLog(`⚖️ ${message}`);
            const newCandidates={}; if(winners.length>1) winners.forEach(id=>newCandidates[id]=1);
            await db.ref(`games/${this.gameId}/sheriff`).set({ candidates:newCandidates, votes:{}, drops:{} });
            if(winners.length>1) await this.updatePhase('SHERIFF_SPEECH');
            else if(this.gameState.round===1) { await this.processNight(); }
            else { await this.updatePhase('DAY'); }
        }
    },

    async tallyDayVotes(){
        const votes=this.fullGameData.dayVotes?.[this.gameState.round]||{};
        const voteCounts={};
        const sheriffId=Object.keys(this.allPlayers).find(id=>this.allPlayers[id].badge);
        const voters=Object.values(this.allPlayers).filter(p=>p.isAlive && !p.isExposedIdiot);
        let details='放逐投票详情：'+voters.map(voter=>{
            const t=votes[voter.id];
            if(t===undefined) return `${voter.id}号(未投票)`;
            if(t==='0') return `${voter.id}号(弃票)`;
            return `${voter.id}号${sheriffId==voter.id?'(警长)':''} → ${t}号`;
        }).join('，');
        await this.addGameLog(details);

        Object.entries(votes).forEach(([voterId,targetId])=>{
            if(targetId!=='0'){
                const w=voterId==sheriffId?1.5:1; voteCounts[targetId]=(voteCounts[targetId]||0)+w;
            }
        });
        const maxVotes=Object.keys(voteCounts).length>0?Math.max(...Object.values(voteCounts)):0;
        const votedOut=Object.keys(voteCounts).filter(id=>voteCounts[id]===maxVotes);

        if(votedOut.length===1){
            const targetId=votedOut[0];
            await this.addGameLog(`⚖️ 投票结束, ${targetId}号玩家以 ${voteCounts[targetId]} 票被放逐。`);
            const killResult=await this.kill(targetId,'VOTE');
            await this.handlePostDeath({ ...killResult, nextPhaseIfNoAction:'NIGHT' });
        }else{
            const message=votedOut.length>1?`平票：${votedOut.join('、')}号。无人出局。`:'无人被投出。';
            await this.addGameLog(`⚖️ ${message}`);
            await this.updatePhase('NIGHT');
        }
    },

    async playerPassBadge(toPlayerId){
        const transferState=this.gameState.postDeathState||{};
        if(this.playerId!==transferState.deadSheriffId){ this.showNotification('你无权操作警徽。','error'); return; }
        const updates={ [`players/${transferState.deadSheriffId}/badge`]:0, [`players/${toPlayerId}/badge`]:1, 'state/postDeathState':null };
        await db.ref(`games/${this.gameId}`).update(updates);
        await this.addGameLog(`👑 警徽已由 ${transferState.deadSheriffId}号 移交给 ${toPlayerId} 号。`);
        await this.handlePostDeath({ hunterTriggered:transferState.hunterTriggered, sheriffDied:false, nextPhaseIfNoAction:transferState.nextPhase });
    },
    async playerDestroyBadge(isForced=false){
        const transferState=this.gameState.postDeathState||{};
        if(!isForced && this.playerId!==transferState.deadSheriffId){ this.showNotification('你无权操作警徽。','error'); return; }
        const updates={ [`players/${transferState.deadSheriffId}/badge`]:0, 'state/postDeathState':null };
        await db.ref(`games/${this.gameId}`).update(updates);
        await this.addGameLog(`💔 警徽已被 ${transferState.deadSheriffId}号 撕毁。`);
        await this.handlePostDeath({ hunterTriggered:transferState.hunterTriggered, sheriffDied:false, nextPhaseIfNoAction:transferState.nextPhase });
    },

    async handlePostDeath({ hunterTriggered, sheriffDied, nextPhaseIfNoAction='DAY' }){
        if(sheriffDied) return;
        const isGameOver=await this.checkWin(); if(isGameOver) return;
        const hunterQueue=(await db.ref(`games/${this.gameId}/state/hunterQueue`).once('value')).val()||{};
        if(Object.keys(hunterQueue).length>0){
            // 存储回流阶段
            await db.ref(`games/${this.gameId}/state/postDeathState`).transaction(v=>{
                v=v||{}; v.nextPhase=nextPhaseIfNoAction; return v;
            });
            await this.updatePhase('HUNTER_ACTION');
        }else if(nextPhaseIfNoAction){
            await this.updatePhase(nextPhaseIfNoAction);
        }
    },

    async kill(pid,cause){
        let resultState={ hunterTriggered:false, sheriffDied:false };
        const playerRef=db.ref(`games/${this.gameId}/players/${pid}`);
        const pBefore=this.allPlayers[pid];
        if(!pBefore || !pBefore.isAlive) return resultState;

        const roleBeforeDeath=this.getActiveRole(pBefore);
        let idiotFlipped=false;
        const trx=await playerRef.transaction(p=>{
            if(!p || !p.isAlive) return p;
            const diedIdentityIndex=p.deaths;
            const diedIdentity=p.identities[diedIdentityIndex];
            if(cause==='VOTE' && diedIdentity && diedIdentity.role==='白痴' && !p.isExposedIdiot){
                p.isExposedIdiot=true; idiotFlipped=true;
                // 特例：翻牌仍失去一条命（按你当前规则保留）
            }
            p.deaths=Math.min(p.deaths+1,2);
            if(p.deaths>=2) p.isAlive=false;
            return p;
        });
        if(!trx.committed) return resultState;
        if(idiotFlipped){ await this.addGameLog(`🤪 ${pid}号玩家因被投票出局，翻开其白痴身份！`); }

        const p=trx.snapshot.val(); const wasSheriff=pBefore.badge; const isNowDead=!p.isAlive;
        const willTriggerHunter = roleBeforeDeath==='猎人' && (['NIGHT','VOTE','POISON','DUEL'].includes(cause));
        if(willTriggerHunter){
            await db.ref(`games/${this.gameId}/state/hunterQueue/${pid}`).set(true);
            resultState.hunterTriggered=true;
        }
        if(isNowDead && wasSheriff){
            const nextPhase=(cause==='DAY'||cause==='VOTE'||cause==='DUEL')?'NIGHT':'DAY';
            await db.ref(`games/${this.gameId}/state`).update({ phase:'SHERIFF_TRANSFER', postDeathState:{ deadSheriffId:pid, hunterTriggered:resultState.hunterTriggered, nextPhase:nextPhase } });
            resultState.sheriffDied=true;
        }
        await this.checkWin();
        return resultState;
    },

    async processNight(){
        await this.addGameLog(`🌙 天亮了。`);
        const actions=this.fullGameData.nightActions?.[this.gameState.round]||{};
        const nightDeaths=[];
        const wolfTarget=actions.wolf?.target;
        const guardTarget=actions.guard?.target;
        const witchCure=actions.witch?.cure;
        const witchPoison=actions.witch?.poison;

        if(wolfTarget && wolfTarget!=='0'){
            const isGuarded=guardTarget===wolfTarget;
            const isCured=witchCure===wolfTarget;
            if(!isGuarded && !isCured){ nightDeaths.push({pid:wolfTarget,cause:'NIGHT'}); }
        }
        if(witchPoison){
            if(!nightDeaths.some(d=>d.pid===witchPoison)){ nightDeaths.push({pid:witchPoison,cause:'POISON'}); }
        }

        let anyHunterTriggered=false, anySheriffDied=false;
        if(nightDeaths.length>0){
            const deadIds=[...new Set(nightDeaths.map(d=>d.pid))].sort((a,b)=>a-b).join('号、');
            await this.addGameLog(`死亡的玩家是：${deadIds}号`);
            await db.ref(`games/${this.gameId}/state/peaceNightStreak`).set(0);
            for(const d of nightDeaths){
                const res=await this.kill(d.pid,d.cause);
                if(res.hunterTriggered) anyHunterTriggered=true;
                if(res.sheriffDied){ anySheriffDied=true; break; }
            }
        }else{
            await this.addGameLog(`昨夜是平安夜。`);
            const newStreak=(this.gameState.peaceNightStreak||0)+1;
            await db.ref(`games/${this.gameId}/state/peaceNightStreak`).set(newStreak);
        }
        const nextPhase='DAY';
        await this.handlePostDeath({ hunterTriggered:anyHunterTriggered, sheriffDied:anySheriffDied, nextPhaseIfNoAction:nextPhase });
    },

    async checkWin(){
        await new Promise(r=>setTimeout(r,100));
        const snapshot=await db.ref(`games/${this.gameId}`).once('value');
        if(!snapshot.exists()) return false;
        const g=snapshot.val();
        if(g.state.phase==='GAME_OVER') return true;

        let winner=null;
        const allPlayers=Object.values(g.players);
        const wolfPlayers=allPlayers.filter(p=>p.originalIdentities.some(id=>ROLES[id.role].faction==='bad'));
        const godPlayers=allPlayers.filter(p=>p.originalIdentities.some(id=>ROLES[id.role].isGod));
        const goldenBabyPlayers=allPlayers.filter(p=>p.originalIdentities.every(id=>id.role==='平民'));

        const areAllWolvesDead=wolfPlayers.every(p=>!p.isAlive);
        if(areAllWolvesDead) winner='游戏结束 - 好人阵营胜利！(狼人已全部出局)';
        if(g.state.peaceNightStreak>=3) winner='游戏结束 - 好人阵营胜利！(连续三晚平安夜)';

        if(!winner){
            const areAllGodsDead=godPlayers.every(p=>!p.isAlive);
            if(areAllGodsDead) winner='游戏结束 - 狼人阵营胜利！(神职已全部出局)';
            const areAllGoldenBabiesDead=goldenBabyPlayers.length>0 && goldenBabyPlayers.every(p=>!p.isAlive);
            if(areAllGoldenBabiesDead) winner='游戏结束 - 狼人阵营胜利！(金宝宝已全部出局)';
        }
        if(winner){
            await db.ref(`games/${this.gameId}/state`).update({ phase:'GAME_OVER', winner });
            await this.addGameLog(`🏆 ${winner}`);
            return true;
        }
        return false;
    },

    // Helpers
    getActiveRole(p){ if(!p || !p.isAlive) return null; if(p.deaths>=p.identities.length) return null; const current=p.identities[p.deaths]; return current?current.role:null; },
    isAnyWolfInGame(){ return Object.values(this.allPlayers).some(p=>p.isAlive && ['狼人','隐狼'].includes(this.getActiveRole(p))); },
    canWolfAct(p){
        const role=this.getActiveRole(p);
        if(!['狼人','隐狼'].includes(role)) return false;
        if(role==='狼人') return true;
        if(role==='隐狼'){ const livingRegular=Object.values(this.allPlayers).filter(p2=>p2.isAlive && this.getActiveRole(p2)==='狼人'); return livingRegular.length===0; }
        return false;
    },
    getAlphaWolfId(){
        const livingRegular=Object.values(this.allPlayers).filter(p=>p.isAlive && this.getActiveRole(p)==='狼人');
        if(livingRegular.length>0) return Math.min(...livingRegular.map(p=>p.id)).toString();
        const livingInvisible=Object.values(this.allPlayers).filter(p=>p.isAlive && this.getActiveRole(p)==='隐狼');
        if(livingInvisible.length>0) return Math.min(...livingInvisible.map(p=>p.id)).toString();
        return null;
    },
    getSkillState(key,player=null,identityIndex=-1){ const p=player||this.playerData; if(!p) return undefined; const idx=identityIndex!==-1?identityIndex:p.deaths; return (p.skillStates||{})[`${idx}_${key}`]; },
    async setSkillState(key,value){ const idx=this.playerData.deaths; const stateKey=`${idx}_${key}`; await db.ref(`games/${this.gameId}/players/${this.playerId}/skillStates/${stateKey}`).set(value); },
    getGlobalSkillState(key,player=null){ const p=player||this.playerData; if(!p) return undefined; return (p.skillStates||{})[`global_${key}`]; },
    async setGlobalSkillState(key,value){ await db.ref(`games/${this.gameId}/players/${this.playerId}/skillStates/global_${key}`).set(value); },

    // 狼人频道
    initWolfListeners(){
        this.stopWolfListeners(false);
        const myRole=this.getActiveRole(this.playerData);
        if(!['狼人','隐狼'].includes(myRole)) return;
        const alphaWolfId=this.getAlphaWolfId();

        this.wolfVotesCallbackRef=(s)=>{
            const votes=s.val()||{};
            const displayEl=this.$('wolf-votes-display'); if(!displayEl) return;
            let wolvesToDisplayInVotePanel;
            if(myRole==='隐狼'){ wolvesToDisplayInVotePanel=Object.values(this.allPlayers).filter(p=>p.isAlive && ['狼人','隐狼'].includes(this.getActiveRole(p))); }
            else { wolvesToDisplayInVotePanel=Object.values(this.allPlayers).filter(p=>p.isAlive && this.getActiveRole(p)==='狼人'); }
            let display='<h4>投票情况</h4><div class="info-box">';
            wolvesToDisplayInVotePanel.forEach(wolf=>{
                const voteTarget=votes[wolf.id];
                const voteText=voteTarget!=null?(voteTarget==='0'?'空刀':`${voteTarget}号`):'尚未投票';
                const isAlpha=wolf.id.toString()===alphaWolfId;
                display+=`<p>${wolf.id}号 ${isAlpha?'<strong>(拍板狼)</strong>':''} → ${voteText}</p>`;
            });
            display+='</div>';
            if(this.playerId===alphaWolfId && votes[alphaWolfId]!=null){
                const alphaVote=votes[alphaWolfId];
                display+=`<div style="text-align:center;margin-top:15px;"><p style="color:var(--success);font-size:1.2em;">你是拍板狼，请确认行动</p><button class="confirm-btn" data-action="wolf-confirm" data-id="${alphaVote}">确认袭击 ${alphaVote==='0'?'空刀':alphaVote+'号'}</button></div>`;
            }else if(!alphaWolfId){
                display+='<p style="text-align:center;">没有狼人可以行动。</p>';
            }else if(votes[alphaWolfId]==null){
                display+=`<p style="text-align:center;">等待 ${alphaWolfId}号 (拍板狼) 投票...</p>`;
            }
            displayEl.innerHTML=display;
        };
        this.wolfVotesListener=db.ref(`games/${this.gameId}/wolfVotes`);
        this.wolfVotesListener.on('value',this.wolfVotesCallbackRef);
        this.wolfVotesListener.once('value').then(this.wolfVotesCallbackRef);

        if(myRole==='狼人'){
            const chatRef=db.ref(`games/${this.gameId}/wolfChat`);
            const chatBox=this.$('wolf-chat-messages'); if(chatBox) chatBox.innerHTML='';
            this.wolfChatListener=chatRef.limitToLast(50).on('child_added',s=>{
                if(!s.exists()) return; const {pid,msg}=s.val(); const box=this.$('wolf-chat-messages'); if(box){ const p=document.createElement('p'); const b=document.createElement('b'); b.textContent=`${pid}号`; p.appendChild(b); p.appendChild(document.createTextNode(`：${this.escapeHTML(msg)}`)); box.appendChild(p); box.scrollTop=box.scrollHeight; }
            });
        }
    },
    stopWolfListeners(hideUI=true){
        if(this.wolfVotesListener){ db.ref(`games/${this.gameId}/wolfVotes`).off('value',this.wolfVotesCallbackRef); this.wolfVotesListener=null; this.wolfVotesCallbackRef=null; }
        if(this.wolfChatListener){ db.ref(`games/${this.gameId}/wolfChat`).off('child_added',this.wolfChatListener); this.wolfChatListener=null; }
        if(hideUI){ const chatEl=this.$('wolf-chat-area'); if(chatEl) chatEl.classList.add('hidden'); }
    }
};

window.App=App;
document.addEventListener('DOMContentLoaded',()=>App.init());
</script>
