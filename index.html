<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>双身份狼人杀 · 电子法官 2025-08-04</title>

<!-- ====== 样式 ====== -->
<style>
:root{--bg:#1a1a2e;--card:#16213e;--border:#0f3460;--accent:#e94560;
--text:#eaeaea;--success:#00d9ff;--danger:#ff006e;--warning:#ffb700;
--gradient:linear-gradient(135deg,#667eea 0%,#764ba2 100%);--shadow:0 10px 30px rgba(0,0,0,.3);
--font:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif}
*{box-sizing:border-box}html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh}
body{display:flex;justify-content:center;align-items:flex-start;padding:16px;background-image:
radial-gradient(circle at 20% 50%,rgba(233,69,96,.12)0%,transparent 60%),
radial-gradient(circle at 80% 80%,rgba(0,217,255,.12)0%,transparent 60%)}
#app{width:100%;max-width:960px;background:var(--card);border-radius:20px;padding:24px;box-shadow:var(--shadow);border:1px solid var(--border);animation:fade .4s}
@keyframes fade{from{opacity:.2;transform:translateY(18px)}to{opacity:1;transform:none}}
h1{margin:0 0 26px;background:var(--gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-align:center;font-size:2rem;letter-spacing:1px}
h2{margin:22px 0 12px;font-size:1.4rem;color:var(--success)}
h3{margin:18px 0 10px;font-size:1.2rem;color:var(--warning)}
.hidden{display:none!important}
button{background:var(--accent);color:#fff;border:none;padding:10px 20px;border-radius:12px;font-size:.95rem;font-weight:600;margin:4px;cursor:pointer;transition:.25s}
button:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 5px 18px rgba(233,69,96,.45)}
button:disabled{opacity:.55;cursor:not-allowed}
button.selected{background:var(--success)!important}
button.control{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%)}
button.confirm{background:linear-gradient(135deg,#4facfe 0%,#00f2fe 100%)}
button.action{background:linear-gradient(135deg,#f093fb 0%,#f5576c 100%)}
.vote-btn{padding:4px 8px;font-size:.8rem;background:var(--danger)}
input[type=text],input[type=number]{padding:9px 12px;border-radius:10px;border:2px solid var(--border);background:rgba(255,255,255,.06);color:var(--text)}
input:focus{outline:none;border-color:var(--accent)}
.player-item{display:flex;justify-content:space-between;align-items:center;margin:10px 0;padding:12px 16px;background:rgba(255,255,255,.05);border-radius:14px;transition:.25s}
.player-item:hover{border:2px solid var(--accent)}
.player-item.dead{opacity:.6}
.player-item.dead-all{opacity:.35;text-decoration:line-through}
.heart{font-size:22px;transition:.25s}
.heart.lost{color:#778;filter:grayscale(1)}
.badge{margin-left:6px;font-size:20px;color:var(--success)}
#timeline{margin-top:8px;background:rgba(255,255,255,.04);padding:14px;border-radius:14px;max-height:260px;overflow-y:auto}
#timeline::-webkit-scrollbar{width:6px}#timeline::-webkit-scrollbar-thumb{background:var(--accent);border-radius:6px}
.timeline-item{margin-bottom:6px;font-size:.9rem;line-height:1.4}
@media(max-width:640px){h1{font-size:1.6rem}button{padding:8px 14px;font-size:.8rem}}
</style>
</head>
<body>
<div id="app">
  <h1 id="title">🌙 双身份狼人杀</h1>

  <!-- ===== 身份配置 ===== -->
  <section id="setup-view">
    <h2>📋 身份配置</h2>
    <div id="role-setup"></div>
    <p style="text-align:center">
      <span style="color:var(--warning)">身份数 <b id="totalCnt">0</b></span> |
      <span style="color:var(--success)">玩家数 <b id="playerCnt">0</b></span>
    </p>
    <div style="text-align:center;margin-top:12px">
      <button id="btn-create" class="control">创建游戏</button>
    </div>
  </section>

  <!-- ===== 玩家视图 ===== -->
  <section id="game-view" class="hidden">
    <div id="myInfo">
      <h2 id="pidLabel"></h2>
      <div id="myIds" style="font-size:1.2rem"></div>
      <div id="swapArea" class="hidden" style="margin-top:10px;text-align:center">
        <button id="btn-swap" class="action">🔄 交换顺序</button>
        <button id="btn-ready" class="confirm">✅ 确定顺序</button>
      </div>
    </div>
    <hr />
    <div id="statusBar" style="padding:14px;text-align:center;background:rgba(255,255,255,.05);border-radius:14px;font-weight:bold"></div>

    <div id="hostPanel" class="hidden"></div>
    <div id="actionPanel"></div>

    <h3>👥 玩家列表</h3>
    <div id="playerList"></div>

    <h3>📝 游戏记录</h3>
    <div id="timeline"></div>
  </section>

  <!-- ===== 后台 ===== -->
  <section id="god-view" class="hidden">
    <h2>👑 上帝后台</h2>
    <div id="godPlayers"></div>
    <h3>📜 日志</h3>
    <div id="godTimeline"></div>
    <h3>⚙️ 原始数据</h3>
    <pre id="godRaw" style="white-space:pre-wrap;font-size:.8rem"></pre>
  </section>
</div>

<!-- ===== Firebase ===== -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>
/* ------------------------------------------------------------------
   双身份狼人杀 · 2025-08-04  完整版
   ------------------------------------------------------------------ */

const firebaseConfig={apiKey:"AIzaSyCEAgB6DoY8YA6lZnYblhIDVTYH_q8UimI",authDomain:"werewolf-game-master-1f37f.firebaseapp.com",databaseURL:"https://werewolf-game-master-1f37f-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"werewolf-game-master-1f37f",storageBucket:"werewolf-game-master-1f37f.appspot.com",messagingSenderId:"626014452910",appId:"1:626014452910:web:35b6eba412f95f1878013f"};
firebase.initializeApp(firebaseConfig);
const db=firebase.database();

/* ==== 角色定义 ==== */
const ROLES={
 '平民':{f:'good',icon:'👤'},
 '守卫':{f:'good',icon:'🛡️',god:1},
 '白痴':{f:'good',icon:'🤪',god:1},
 '预言家':{f:'good',icon:'🔮',god:1},
 '骑士':{f:'good',icon:'⚔️',god:1},
 '女巫':{f:'good',icon:'🧪',god:1},
 '猎人':{f:'good',icon:'🔫',god:1},
 '狼人':{f:'bad',icon:'🐺'},
 '隐狼':{f:'bad',icon:'🌑',invis:1},
 '盗贼':{f:'neutral',icon:'🎭',thief:1}
};
const DEFAULT={'平民':6,'守卫':1,'白痴':1,'预言家':1,'骑士':1,'女巫':1,'猎人':1,'狼人':2,'隐狼':1,'盗贼':1};
const BAN=[['预言家','狼人'],['预言家','隐狼'],['盗贼','狼人'],['盗贼','隐狼'],['隐狼','狼人'],['隐狼','隐狼']];

const $=id=>document.getElementById(id);
const qs=k=>new URLSearchParams(location.search).get(k);

const App={
 gid:null,pid:null,isHost:false,game:{},me:{},listeners:[],
 init(){
   this.gid=qs('game');this.pid=qs('player');
   if(!this.gid){this.renderSetup();return}
   if(this.pid==='0'){this.show('god-view');this.listen();return}
   this.show('game-view');this.listen()
 },
 show(v){['setup-view','game-view','god-view'].forEach(s=>$(s).classList.add('hidden'));$(v).classList.remove('hidden')},
 listen(){
   db.ref(`games/${this.gid}`).on('value',s=>{
     if(!s.exists()){document.body.innerHTML='<h2>游戏不存在或已结束</h2>';return}
     this.game=s.val();this.renderAll()
   })
 },
 /* ========== 创建游戏 ========== */
 renderSetup(){
   this.show('setup-view');
   const box=$('role-setup');box.innerHTML='';
   Object.keys(DEFAULT).forEach(r=>{
     const div=document.createElement('div');
     div.style.display='flex';div.style.justifyContent='space-between';div.style.margin='6px 0';
     div.innerHTML=`<span>${ROLES[r].icon} ${r}</span>
       <input type="number" id="role-${r}" min="0" value="${DEFAULT[r]}">`;
     box.appendChild(div)
   });
   const calc=()=>{
     let sum=0;box.querySelectorAll('input').forEach(i=>sum+=+i.value||0);
     $('totalCnt').textContent=sum;$('playerCnt').textContent=sum/2
   };
   box.oninput=calc;calc();
   $('btn-create').onclick=()=>this.create()
 },
 create(){
   const pool=[];document.querySelectorAll('#role-setup input').forEach(i=>{
     for(let k=0;k<+i.value;k++)pool.push(i.id.replace('role-',''))
   });
   if(!pool.length||pool.length%2){alert('身份需为偶数且≥2');return}
   const pairs=this.deal(pool);if(!pairs){alert('无法发牌');return}
   const gid=db.ref('games').push().key,pc=pool.length/2,players={};
   for(let i=1;i<=pc;i++){
     players[i]={id:i,identities:pairs[i-1],original:[...pairs[i-1]].map(o=>({...o})),deaths:0,alive:1,ready:0,skill:{},badge:0}
   }
   db.ref(`games/${gid}`).set({
     state:{ph:'SETUP',round:0,creator:1,nightStatus:{},hunterQ:[],log:[],peace:0},
     players,config:{pc},wolfChat:{},wolfVotes:{},nightActions:{},sheriff:{}
   }).then(()=>{
     alert(`游戏创建成功\n游戏ID: ${gid}\n您是1号玩家`);location.href=`?game=${gid}&player=1`
   })
 },
 deal(pool){
   for(let t=0;t<4000;t++){
     const s=[...pool].sort(()=>Math.random()-.5),p=[];
     let ok=1;
     for(let i=0;i<s.length;i+=2){
       const a=s[i],b=s[i+1];
       if(BAN.some(([x,y])=>(x===a&&y===b)||(x===b&&y===a))){ok=0;break}
       const wrap=r=>({role:r,copy:0});
       p.push([wrap(a),wrap(b)])
     }
     if(ok)return p
   }return null
 },
 /* ========== 通用渲染 ========== */
 renderAll(){
   if(this.pid!=='0'){this.me=this.game.players[this.pid];this.isHost=this.pid==this.game.state.creator}
   this.renderStatus();if(this.pid!=='0'){this.renderMine();this.renderPlayers();this.renderAction();if(this.isHost)this.renderHost()}
   else this.renderGod()
 },
 renderStatus(){
   const st=this.game.state,ph=st.ph;
   if(this.pid!=='0'){
     const m={
       SETUP:'等待玩家准备',
       NIGHT:`第${st.round}夜`,
       SHERIFF_CAND:'警长竞选：是否上警',
       SHERIFF_SPEECH:'警长竞选：发言/可退水',
       SHERIFF_VOTE:'警长竞选：投票',
       DAY_SPEECH:`第${st.round}天 发言阶段`,
       DAY_VOTE:`第${st.round}天 投票阶段`,
       GAME_OVER:st.winner||'游戏结束'
     };
     $('statusBar').textContent=m[ph]||ph
   }
 },
 /* ---------- 我的信息 ---------- */
 renderMine(){
   $('pidLabel').innerHTML=`你是 <b>${this.pid}</b> 号${this.isHost?'（主持）':''}${this.me.badge?' 🔰':''}`;
   const d=this.me.deaths,ids=this.me.identities;
   const tag=i=>`${ROLES[i.role].icon}${i.copy?'<i style="font-size:.8rem;color:#aaa">-贼</i>':''} ${i.role}`;
   $('myIds').innerHTML=`${d>=1?'<s>':''}${tag(ids[0])}${d>=1?'</s>':''} + ${d>=2?'<s>':''}${tag(ids[1])}${d>=2?'</s>':''}`;
   const swap=(this.game.state.ph==='SETUP'&&!this.me.ready);$('swapArea').classList[swap?'remove':'add']('hidden');
   if(swap){
     $('btn-swap').onclick=()=>db.ref(`games/${this.gid}/players/${this.pid}/identities`).set([ids[1],ids[0]]);
     $('btn-ready').onclick=()=>db.ref(`games/${this.gid}/players/${this.pid}/ready`).set(1)
   }
 },
 /* ---------- 玩家列表 ---------- */
 renderPlayers(){
   const list=$('playerList');list.innerHTML='';
   Object.values(this.game.players).forEach(p=>{
     const live=2-p.deaths;
     const div=document.createElement('div');
     div.className=`player-item ${!p.alive?'dead-all':p.deaths?'dead':''}`;
     const hearts=`<span class="heart ${live<1?'lost':''}">❤</span><span class="heart ${live<2?'lost':''}">❤</span>`;
     div.innerHTML=`<span><b>${p.id}</b>${p.badge?' 🔰':''}${p.id==this.pid?' (你)':''}</span><span>${hearts}</span>`;
     list.appendChild(div)
   });
   /* --- 时间线 --- */
   $('timeline').innerHTML=this.game.state.log.map(l=>`<div class="timeline-item">${l}</div>`).join('')
 },
 /* ---------- 行动面板 ---------- */
 renderAction(){
   const ph=this.game.state.ph,box=$('actionPanel');box.innerHTML='';
   if(!this.me.alive||ph==='GAME_OVER'){return}
   /* ===== 警长流程 ===== */
   if(ph==='SHERIFF_CAND'){
     box.innerHTML=`<h3>是否上警</h3>
       <button class="action" id="btn-up">我要上警</button>
       <button class="control" id="btn-no">不上警</button>`;
     $('btn-up').onclick=()=>db.ref(`games/${this.gid}/sheriff/cand/${this.pid}`).set(1);
     $('btn-no').onclick=()=>db.ref(`games/${this.gid}/sheriff/cand/${this.pid}`).set(0)
     return
   }
   if(ph==='SHERIFF_SPEECH'){
     if(this.game.sheriff.cand[this.pid]){
       box.innerHTML='<button class="action" id="btn-drop">退水（退出竞选）</button>';
       $('btn-drop').onclick=()=>db.ref(`games/${this.gid}/sheriff/drop/${this.pid}`).set(1)
     }return
   }
   if(ph==='SHERIFF_VOTE'){
     const cand=Object.keys(this.game.sheriff.cand).filter(id=>this.game.sheriff.cand[id]&&!this.game.sheriff.drop?.[id]);
     let h='<h3>请选择警长</h3>';
     cand.forEach(id=>h+=`<button class="action vote" data-id="${id}">${id}号</button>`);
     h+='<button class="control vote" data-id="0">弃票</button>';
     box.innerHTML=h;
     box.querySelectorAll('.vote').forEach(b=>b.onclick=()=>db.ref(`games/${this.gid}/sheriff/vote/${this.pid}`).set(b.dataset.id))
     return
   }
   /* ===== 白天投票 ===== */
   if(ph==='DAY_VOTE'){
     const alive=Object.values(this.game.players).filter(p=>p.alive);
     let h='<h3>请选择要票出的人</h3>';
     alive.forEach(p=>h+=`<button class="action dv" data-id="${p.id}">${p.id}号</button>`);
     h+='<button class="control dv" data-id="0">弃票</button>';
     box.innerHTML=h;
     box.querySelectorAll('.dv').forEach(b=>b.onclick=()=>db.ref(`games/${this.gid}/dayVotes/${this.game.state.round}/${this.pid}`).set(b.dataset.id))
     return
   }
   /* ===== 夜晚行动（示例：狼人互认&聊天，其它角色与旧版相同） ===== */
   if(ph==='NIGHT'){
     const role=this.getRole(this.me);
     if(['狼人','隐狼'].includes(role)&&this.canWolfAct(this.me)){
       this.panelWolf();return
     }
   }
 },
 /* ======= 狼人面板 ======= */
 panelWolf(){
   const wolves=Object.values(this.game.players).filter(p=>p.alive&&this.canWolfAct(p));
   const idsView=wolves.map(p=>p.id).join('、');
   let h=`<h3>🐺 狼人行动</h3><p style="color:var(--success);font-size:.9rem">队友：${idsView}</p>`;
   Object.values(this.game.players).filter(p=>p.alive).forEach(p=>{
     h+=`<button class="action wolfT" data-id="${p.id}">${p.id}号</button>`
   });
   if(this.pid==Math.min(...wolves.map(p=>p.id))){
     h+='<div style="margin-top:6px"><button id="wolf-ok" class="confirm">✅ 确定击杀</button><button id="wolf-skip" class="control">⏭️ 空刀</button></div>'
   }
   $('actionPanel').innerHTML=h;
   document.querySelectorAll('.wolfT').forEach(b=>{
     if(this.me.wolfVote==b.dataset.id)b.classList.add('selected');
     b.onclick=()=>{db.ref(`games/${this.gid}/players/${this.pid}/wolfVote`).set(b.dataset.id);db.ref(`games/${this.gid}/wolfVotes/${this.pid}`).set(b.dataset.id)}
   });
   if($('wolf-ok'))$('wolf-ok').onclick=()=>this.wolfConfirm();
   if($('wolf-skip'))$('wolf-skip').onclick=()=>this.wolfSkip()
 },
 wolfConfirm(){
   db.ref(`games/${this.gid}/wolfVotes`).once('value').then(s=>{
     const v=s.val()||{},cnt={};Object.values(v).forEach(t=>cnt[t]=(cnt[t]||0)+1);
     const tgt=Object.keys(cnt).reduce((a,b)=>cnt[a]>cnt[b]?a:b);
     db.ref(`games/${this.gid}/nightActions/wolfKill`).set(tgt);
     db.ref(`games/${this.gid}/state/nightStatus/wolf`).set('complete')
   })
 },
 wolfSkip(){
   db.ref(`games/${this.gid}/nightActions/wolfKill`).set(null);
   db.ref(`games/${this.gid}/state/nightStatus/wolf`).set('complete')
 },
 /* ======================================================= */
 /* ------------------- 主持人面板 ------------------- */
 renderHost(){
   const box=$('hostPanel');box.classList.remove('hidden');const st=this.game.state,ph=st.ph;
   let h='<h3>主持人</h3>';
   if(ph==='SETUP'){
     const ready=Object.values(this.game.players).filter(p=>p.ready).length;
     h+=`准备：${ready}/${Object.keys(this.game.players).length}<br>
     <button class="control" id="btn-lock" ${ready<Object.keys(this.game.players).length?'disabled':''}>🔒 开始游戏</button>`
   }
   if(ph==='SHERIFF_CAND'){
     const candDone=Object.keys(this.game.sheriff?.cand||{}).length;
     h+=`上警意向：${candDone}/${Object.values(this.game.players).filter(p=>p.alive).length}
     <br><button class="control" id="btn-next" ${candDone?'' :'disabled'}>➡️ 全员完成，进入发言</button>`
   }
   if(ph==='SHERIFF_SPEECH'){
     h+='<button class="control" id="btn-sv">发言完毕 ➡️ 投票</button>'
   }
   if(ph==='SHERIFF_VOTE'){
     const v=this.game.sheriff.vote||{},need=Object.values(this.game.players).filter(p=>p.alive).length;
     h+=`已投：${Object.keys(v).length}/${need}<br><button class="control" id="btn-count" ${Object.keys(v).length===need?'':'disabled'}>统计票型</button>`
   }
   if(ph==='DAY_SPEECH'){
     h+='<button class="control" id="btn-openVote">发言完毕 ➡️ 投票</button>'
   }
   if(ph==='DAY_VOTE'){
     const v=this.game.dayVotes?.[st.round]||{},need=Object.values(this.game.players).filter(p=>p.alive).length;
     h+=`已投：${Object.keys(v).length}/${need}<br><button class="control" id="btn-countDay" ${Object.keys(v).length===need?'':'disabled'}>统计票型</button>`
   }
   if(ph==='NIGHT'){
     const ns=st.nightStatus||{},done=Object.values(ns).every(x=>x==='complete');
     h+=`夜晚行动：${done?'✅ 完成':'⏳ 进行中'}<br><button class="control" id="btn-day" ${done?'':'disabled'}>结算 ➡️ 天亮</button>`
   }
   box.innerHTML=h;

   /* 事件 */
   if($('btn-lock'))$('btn-lock').onclick=()=>this.toNight(1);
   if($('btn-next'))$('btn-next').onclick=()=>db.ref(`games/${this.gid}/state/ph`).set('SHERIFF_SPEECH');
   if($('btn-sv'))$('btn-sv').onclick=()=>db.ref(`games/${this.gid}/state/ph`).set('SHERIFF_VOTE');
   if($('btn-count'))$('btn-count').onclick=()=>this.countSheriff();
   if($('btn-openVote'))$('btn-openVote').onclick=()=>db.ref(`games/${this.gid}/state/ph`).set('DAY_VOTE');
   if($('btn-countDay'))$('btn-countDay').onclick=()=>this.countDayVote();
   if($('btn-day'))$('btn-day').onclick=()=>this.processNight()
 },
 /* ---------- 开局到夜晚 ---------- */
 toNight(round){
   const ns={guard:'pending',seer:'pending',wolf:'pending',witch:'locked'};
   db.ref(`games/${this.gid}/state`).update({ph:'NIGHT',round,nightStatus:ns});
   this.addLog(`进入第${round}夜`)
 },
 /* ---------- 警长投票统计 ---------- */
 countSheriff(){
   const data=this.game.sheriff,cand=Object.keys(data.cand).filter(id=>data.cand[id]&&!data.drop?.[id]),
   votes=data.vote||{};
   let cnt={};cand.forEach(id=>cnt[id]=0);Object.values(votes).forEach(v=>{if(cnt[v]!=null)cnt[v]++});
   const max=Math.max(...Object.values(cnt));
   const tops=Object.keys(cnt).filter(k=>cnt[k]===max);
   let log=`警长投票：`;Object.entries(votes).forEach(([p,v])=>log+=`${p}→${v||'弃票'}  `);
   this.addLog(log);
   if(tops.length===1){
     db.ref(`games/${this.gid}/players/${tops[0]}/badge`).set(1);
     this.addLog(`警长产生：${tops[0]}号`);
     db.ref(`games/${this.gid}/state/ph`).set('DAY_SPEECH')
   }else{
     /* 平票进入下一轮，仅保留平票玩家 */
     const newCand={};tops.forEach(id=>newCand[id]=1);
     db.ref(`games/${this.gid}/sheriff`).set({cand:newCand,drop:{},vote:{}});
     this.addLog(`警长平票，进入下一轮`);
     db.ref(`games/${this.gid}/state/ph`).set('SHERIFF_SPEECH')
   }
 },
 /* ---------- 白天投票统计 ---------- */
 countDayVote(){
   const round=this.game.state.round,votes=this.game.dayVotes[round];
   let cnt={};Object.entries(votes).forEach(([p,v])=>{cnt[v]= (cnt[v]||0)+1});
   const log=`第${round}天投票：`+Object.entries(votes).map(([p,v])=>`${p}→${v||'弃票'}`).join(' ');
   this.addLog(log);
   const allAbstain=Object.keys(cnt).length===1&&cnt['0'];
   if(allAbstain){this.addLog('全部弃票，进入夜晚');this.toNight(round+1);return}
   const max=Math.max(...Object.values(cnt)),tops=Object.keys(cnt).filter(k=>cnt[k]===max&&k!=='0');
   if(tops.length===1){
     this.addLog(`票出 ${tops[0]}号`);this.kill(tops[0],'VOTE').then(()=>this.toNight(round+1))
   }else{
     /* PK 投票 */
     db.ref(`games/${this.gid}/state`).update({pk:tops});
     this.addLog(`平票进入PK ${tops.join('、')}号 重新发言`);
     db.ref(`games/${this.gid}/state/ph`).set('DAY_SPEECH')
   }
 },
 /* ---------- 日志 ---------- */
 addLog(t){
   db.ref(`games/${this.gid}/state/log`).transaction(l=>{if(!l)l=[];l.push(t);return l})
 },
 /* ======================================================= */
 /* ------------------------- GOD ------------------------- */
 renderGod(){
   $('title').textContent=`后台 - ${this.gid}`;
   $('godPlayers').innerHTML=Object.values(this.game.players).map(p=>{
     const ids=p.original.map(i=>`${ROLES[i.role].icon}${i.role}`).join(' + ');
     return `<div class="player-item">${p.id}号 ${p.badge?'🔰':''} - ${ids}</div>`
   }).join('');
   $('godTimeline').innerHTML=this.game.state.log.map(l=>`<div class="timeline-item">${l}</div>`).join('');
   $('godRaw').textContent=JSON.stringify(this.game,null,2)
 },
 /* ======================================================= */
 /* ------------ 工具 ------------ */
 getRole(p){return p.alive?p.identities[p.deaths].role:null},
 canWolfAct(p){
   const r=this.getRole(p);
   if(r==='狼人')return 1;
   if(r==='隐狼'){
     const liveW=Object.values(this.game.players).some(x=>x.alive&&x.id!==p.id&&this.getRole(x)==='狼人');
     return !liveW
   }
   return 0
 },
 /* ---------------- 夜晚结算（简化版） ---------------- */
 async processNight(){
   const na=this.game.nightActions||{},k=na.wolfKill,dead=[];
   if(k!=null){dead.push(k)}
   const uniq=[...new Set(dead)];
   if(!uniq.length){this.addLog('平安夜');db.ref(`games/${this.gid}/state/peace`).transaction(x=>(x||0)+1)}
   else{
     this.addLog(`昨夜死亡：${uniq.join('、')}号`);
     for(const id of uniq)await this.kill(id,'NIGHT')
     db.ref(`games/${this.gid}/state/peace`).set(0)
   }
   db.ref(`games/${this.gid}/state/ph`).set(this.game.state.round===1?'SHERIFF_CAND':'DAY_SPEECH')
 },
 async kill(id,cause){
   const p=this.game.players[id];if(!p||!p.alive)return;
   const updates={};
   if(this.getRole(p)==='白痴'&&cause==='VOTE'&&!p.exposed){
     updates[`players/${id}/exposed`]=1;
     this.addLog(`${id}号白痴翻牌，存活`);
   }else{
     const d=p.deaths+1,alive=d<2;
     updates[`players/${id}/deaths`]=d;updates[`players/${id}/alive`]=alive;
     if(!alive)this.addLog(`${id}号死亡`);
   }
   await db.ref(`games/${this.gid}`).update(updates)
 }
};

document.addEventListener('DOMContentLoaded',()=>App.init());
</script>
